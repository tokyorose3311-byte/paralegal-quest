[build]
  command = "bash netlify/build.sh"
  publish = "build/web"
  functions = "netlify/functions"

[[redirects]]
  from = "/success.html"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/privacy-policy"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
